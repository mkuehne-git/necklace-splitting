version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    ignore:
      # @types/node follows the Node version in .nvmrc (24); lift this when switching to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime-dependencies:
        patterns:
          - "three"
          - "html2canvas"
          - "@fontsource/*"
      build-tooling:
        patterns:
          - "vite"
          - "vite-plugin-pwa"
          - "@vitejs/*"
          - "vite-plugin-glsl"
          - "@types/*"
          - "typescript"
      test-tooling:
        patterns:
          - "vitest"
          - "happy-dom"
          - "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
