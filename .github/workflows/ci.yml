name: CI

# Unit tests, a production build and the Playwright end-to-end tests for
# every push to main and every pull request (including Dependabot's). It does
# not deploy: deployment stays a manual `deploy.sh` run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; the token gets nothing more, whatever the
# repository's default. (Uploading the test traces needs no token permission.)
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Keep in line with the local Node version, see "Node.js version" in CLAUDE.md.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # src/imprint-gen.js holds the private imprint and is gitignored, but
      # src/Imprint.ts imports it statically so Vite bundles it. This stub only
      # lets the import resolve; this build is never deployed.
      - name: Stub the private imprint module
        run: echo 'export const imprintHtml = () => undefined;' > src/imprint-gen.js

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run production build
        run: npm run build

  # The Playwright tests (TESTING.md, step 3) in Chromium and Firefox, against
  # a test build; in a job of their own, so that the unit tests report first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The imprint tests skip themselves with the stub.
      - name: Stub the private imprint module
        run: echo 'export const imprintHtml = () => undefined;' > src/imprint-gen.js

      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Firefox draws WebGL through the system's OpenGL; the runner has no GPU, and
      # headless Firefox finds no driver. With a window on a virtual display
      # (playwright.config.ts: not headless on CI) it uses Mesa's software
      # renderer. Chromium brings its own (SwiftShader) and stays headless.
      - name: Install Mesa's software OpenGL for Firefox
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

      # Traces of the failed tests (trace: 'retain-on-failure'), to open with `npx playwright show-trace`.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
